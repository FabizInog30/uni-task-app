<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uni Task List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0d14;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      padding: 40px 16px 80px;
      color: #d8d4cc;
    }

    #app { width: 100%; max-width: 540px; }

    .label {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #3a3a50;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 34px;
      font-weight: 400;
      color: #f0ede6;
      line-height: 1.1;
      margin-bottom: 28px;
    }

    h1 em { font-style: italic; color: #c8b88a; }

    /* Toggle */
    .toggle {
      display: inline-flex;
      background: #13131c;
      border-radius: 12px;
      border: 1px solid #1e1e2c;
      padding: 4px;
      gap: 2px;
      margin-bottom: 28px;
    }

    .toggle button {
      padding: 9px 20px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #3a3a52;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }

    .toggle button.active {
      background: #c8b88a;
      color: #0d0d14;
      font-weight: 700;
    }

    /* Progress */
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #444;
      margin-bottom: 7px;
    }

    .progress-row span.pct { color: #c8b88a; }
    .progress-row span.pct.done { color: #4caf88; }

    .progress-bar-bg {
      height: 3px;
      background: #1a1a24;
      border-radius: 4px;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #c8b88a;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* Subject filters */
    .filters {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #1e1e2c;
      background: transparent;
      color: #333;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }

    .empty {
      text-align: center;
      color: #252530;
      padding: 36px 0;
      font-size: 14px;
    }

    .task-card {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 14px;
      background: #13131c;
      border-radius: 10px;
      border: 1px solid #1c1c28;
      border-left-width: 3px;
      transition: opacity 0.2s;
    }

    .task-card.done { opacity: 0.4; }

    .check-btn {
      margin-top: 2px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid #f5a623;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #0d0d14;
      transition: all 0.2s;
    }

    .task-card.done .check-btn {
      background: #4caf88;
      border-color: #4caf88;
    }

    .task-content { flex: 1; min-width: 0; }

    .task-text {
      font-size: 14px;
      color: #ccc8c0;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .task-card.done .task-text {
      text-decoration: line-through;
      color: #2e2e3e;
    }

    .task-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      border: 1px solid transparent;
    }

    .due-label { font-size: 11px; color: #2e2e42; }

    .delete-btn {
      background: none;
      border: none;
      color: #222230;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .delete-btn:hover { color: #ff4d4d; }

    /* Add task */
    .add-trigger {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px dashed #1e1e2c;
      background: transparent;
      color: #2e2e42;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-trigger:hover { border-color: #c8b88a; color: #c8b88a; }

    .add-form {
      background: #13131c;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #1e1e2c;
      display: none;
    }

    .add-form.visible { display: block; }

    .form-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 14px;
    }

    .form-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid #1e1e2c;
      border-radius: 8px;
      padding: 10px 12px;
      color: #d8d4cc;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }

    .form-select {
      background: #0d0d14;
      border: 1px solid #1e1e2c;
      border-radius: 8px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      color: #d8d4cc;
    }

    .form-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .form-row .form-select,
    .form-row input[type="date"] {
      flex: 1;
      min-width: 120px;
      background: #0d0d14;
      border: 1px solid #1e1e2c;
      border-radius: 8px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      color: #d8d4cc;
    }

    .btn-row { display: flex; gap: 8px; margin-top: 10px; }

    .btn-cancel {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1e1e2c;
      background: transparent;
      color: #333;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-add {
      flex: 2;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #c8b88a;
      color: #0d0d14;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d14">
</head>
<body>
<div id="app"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzeN9ekGejjLad4ncxeXHGrXKJG2EKB2yeuccgb97n9Rd66V_BWAT34Vwbo9k4_uOKb/exec";

const SUBJECTS = [
  "Linear Algebra",
  "Fundamentals of Electronics",
  "Programming II",
  "Fundamentals of Computers II",
  "Mathematics Discrete and Logical II",
];

const SUBJECT_COLORS = {
  "Linear Algebra": "#7b8cde",
  "Fundamentals of Electronics": "#e07b5a",
  "Programming II": "#4caf88",
  "Fundamentals of Computers II": "#c47fd4",
  "Mathematics Discrete and Logical II": "#5ab4e0",
};

const PRIORITY_COLORS = { high: "#ff4d4d", medium: "#f5a623", low: "#4caf88" };
const PRIORITY_LABELS = { high: "Urgent", medium: "Soon", low: "Later" };

let state = {
  page: "assignment",
  filterSubject: "All",
  showAdd: false,
  tasks: [],
  form: { text: "", due: "", priority: "medium", subject: SUBJECTS[0] },
};

async function loadTasks() {
  try {
    const res = await fetch(API_URL);
    return await res.json();
  } catch {
    return [];
  }
}

async function saveTasks() {

  await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(state.tasks)
  });
}
}

function formatDue(dateStr) {
  if (!dateStr || dateStr === "—") return null;
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "className") e.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else e.setAttribute(k, v);
  }
  children.forEach(child => {
    if (child != null)
      e.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  });
  return e;
}

function render() {

  const { page, filterSubject, showAdd, tasks } = state;

  const pageTasks = tasks.filter(t => t.type === page);

  const filtered = pageTasks
    .filter(t => filterSubject === "All" || t.subject === filterSubject)
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return { high:0, medium:1, low:2 }[a.priority] -
             { high:0, medium:1, low:2 }[b.priority];
    });

  const done = pageTasks.filter(t => t.done).length;
  const pct = pageTasks.length ? Math.round((done / pageTasks.length) * 100) : 0;
  const isAssignment = page === "assignment";

  const app = document.getElementById("app");
  app.innerHTML = "";

  app.appendChild(el("div",{className:"label"},"Academic Planner"));
  app.appendChild(el("h1",{},"Your tasks,",el("br"),el("em",{},"sorted.")));

  const toggle = el("div",{className:"toggle"});

  [
    {key:"assignment",label:"✏️ Assignments"},
    {key:"exam",label:"📚 Exams & Study"}
  ].forEach(({key,label})=>{
    toggle.appendChild(
      el("button",{
        className:page===key?"active":"",
        onClick:()=>{state.page=key;state.filterSubject="All";render();}
      },label)
    );
  });

  app.appendChild(toggle);

  const pctSpan = el("span",{className:"pct"},pct+"%");
  app.appendChild(el("div",{className:"progress-row"},
    el("span",{},`${done} of ${pageTasks.length} complete`),
    pctSpan
  ));

  const fillBar = el("div",{className:"progress-bar-fill"});
  fillBar.style.width=pct+"%";
  app.appendChild(el("div",{className:"progress-bar-bg"},fillBar));

  const list = el("div",{className:"task-list"});

  filtered.forEach(task=>{

    const card = el("div",{className:"task-card"+(task.done?" done":"")});

    const check = el("button",{className:"check-btn",
      onClick:()=>{
        task.done=!task.done;
        saveTasks();
        render();
      }
    },task.done?"✓":"");

    const text = el("div",{className:"task-text"},task.text);

    const del = el("button",{className:"delete-btn",
      onClick:()=>{
        state.tasks=state.tasks.filter(t=>t.id!==task.id);
        saveTasks();
        render();
      }
    },"×");

    card.append(check,el("div",{className:"task-content"},text),del);

    list.appendChild(card);

  });

  app.appendChild(list);

  app.appendChild(
    el("button",{className:"add-trigger",onClick:()=>{state.showAdd=true;render();}},
    `+ Add ${isAssignment?"assignment":"exam / study task"}`)
  );

}

function addTask(){

  const {text,due,priority,subject}=state.form;

  if(!text.trim())return;

  state.tasks.push({
    id:crypto.randomUUID(),
    text:text.trim(),
    due:due||"—",
    done:false,
    priority,
    subject,
    type:state.page
  });

  state.form={text:"",due:"",priority:"medium",subject:SUBJECTS[0]};
  state.showAdd=false;

  saveTasks();
  render();

}

render();

loadTasks().then(tasks=>{
  state.tasks=tasks||[];
  render();
});

setInterval(async()=>{
  const remote=await loadTasks();
  if(JSON.stringify(remote)!==JSON.stringify(state.tasks)){
    state.tasks=remote;
    render();
  }
},3000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js");
  });
}

</script>
</body>
</html>
