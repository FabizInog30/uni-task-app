
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uni Task List</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d14">
</head>
<body>
<div id="app"></div>

<script>

// 🔗 Google Sheets API endpoint
const API_URL = "https://script.google.com/macros/s/AKfycbzeN9ekGejjLad4ncxeXHGrXKJG2EKB2yeuccgb97n9Rd66V_BWAT34Vwbo9k4_uOKb/exec";

const SUBJECTS = [
  "Linear Algebra",
  "Fundamentals of Electronics",
  "Programming II",
  "Fundamentals of Computers II",
  "Mathematics Discrete and Logical II",
];

// ── State ─────────────────────────────
let state = {
  page: "assignment",
  filterSubject: "All",
  showAdd: false,
  nextId: 1,
  tasks: [],
  form: { text: "", due: "", priority: "medium", subject: SUBJECTS[0] },
};

// ── Load from Google Sheets ───────────
async function loadTasks() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    return data || [];
  } catch (err) {
    console.error("Load failed", err);
    return [];
  }
}

// ── Save to Google Sheets ─────────────
async function saveTasks() {
  try {
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(state.tasks),
    });
  } catch (err) {
    console.error("Save failed", err);
  }
}

// ── Helpers ───────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const child of children) {
    if (child == null) continue;
    e.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return e;
}

// ── Render ────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  state.tasks.forEach(task => {
    const item = el("div", {},
      task.text + " (" + task.subject + ")"
    );
    app.appendChild(item);
  });

  const btn = el("button", {
    onClick: addTask
  }, "+ Add test task");

  app.appendChild(btn);
}

// ── Add task demo ─────────────────────
function addTask() {
  const newTask = {
    id: Date.now(),
    text: "New task",
    due: "",
    done: false,
    priority: "medium",
    subject: SUBJECTS[0],
    type: state.page,
  };

  state.tasks.push(newTask);
  saveTasks();
  render();
}

// ── Init ──────────────────────────────
render();

loadTasks().then(tasks => {
  state.tasks = tasks;
  render();
});

</script>
</body>
</html>
